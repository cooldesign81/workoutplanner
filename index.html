<style>
  :root{
    --bg:#10110C;
    --bg-2:#0A0B07;
    --surface:#17180F;
    --surface-2:#1E2013;
    --surface-3:#262918;
    --border:#2C2F1C;
    --text:#FFFFFF;
    --text-dim:#B9BCA6;
    --text-faint:#6C6F5C;
    --gold:#D7FC00;
    --gold-strong:#E7FF4D;
    --gold-ink:#10110C;
    --pine:#5C7A0F;
    --pine-soft:#1C2008;
    --rust:#FF5B4D;
    --rust-soft:#2B120D;
    --radius:18px;
    --radius-sm:12px;
    --font-display:'Manrope',sans-serif;
    --font-body:'Manrope',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --glow:0 0 26px rgba(215,252,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(180deg, rgba(16,17,12,0.82) 0%, rgba(16,17,12,0.93) 45%, var(--bg) 78%),
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(215,252,0,0.08) 0%, transparent 60%),
      url('https://images.unsplash.com/photo-1685633224966-fd18820f6016?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGd5bSUyMHRvb2x8ZW58MHx8MHx8fDA%3D');
    background-repeat:no-repeat, no-repeat, no-repeat;
    background-position: top, top, top center;
    background-size: 100% 100vh, 100% 100vh, cover;
    background-attachment: fixed, fixed, fixed;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:var(--gold-ink);}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- HEADER ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:
      linear-gradient(180deg, rgba(16,17,12,0.5) 0%, rgba(16,17,12,0.85) 65%, rgba(16,17,12,0.97) 100%),
      var(--header-img, url('https://images.unsplash.com/photo-1685633224784-6389eb0c3157?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTM3fHxneW0lMjB0b29sfGVufDB8fDB8fHww')) center 30% / cover no-repeat;
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 18px 12px;
  }
  .brand{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:12px;gap:10px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
    text-transform:none;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
  .brand h1 span{color:var(--gold);}
  .version-tag{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:0.02em;
    text-transform:none;
    color:var(--text-faint);
    font-weight:500;
    margin-left:4px;
    vertical-align:middle;
  }
  .brand .tagline{
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-family:var(--font-mono);
  }
  .music-btn{
    flex-shrink:0;width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
  }
  .music-btn svg{width:16px;height:16px;}
  .music-btn:active{background:var(--pine-soft);color:var(--gold-strong);border-color:var(--pine);}
  .week-stepper{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:12px;
  }
  .week-stepper button{
    width:32px;height:32px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-dim);font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, color .15s;
  }
  .week-stepper button:active{background:var(--pine-soft);color:var(--gold-strong);}
  .week-label{
    font-family:var(--font-mono);font-weight:700;font-size:15px;
    color:var(--gold-strong);
    min-width:96px;text-align:center;letter-spacing:0.02em;
  }
  .week-label .of{color:var(--text-faint);font-weight:500;font-size:12px;}
  .day-pills{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .day-pills::-webkit-scrollbar{display:none;}
  .day-pill{
    flex:1;min-width:0;
    border:1px solid var(--border);background:var(--surface-2);
    border-radius:12px;padding:8px 6px 7px;
    text-align:center;transition:all .15s;
  }
  .day-pill .d{
    font-family:var(--font-display);font-size:15px;font-weight:600;
    color:var(--text);display:block;
  }
  .day-pill .s{
    font-size:9.5px;color:var(--text-faint);
    display:block;margin-top:1px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .day-pill.active{
    background:var(--gold);
    border-color:var(--gold);
    box-shadow:0 0 18px rgba(215,252,0,0.3);
  }
  .day-pill.active .d{color:var(--gold-ink);font-weight:800;}
  .day-pill.active .s{color:#31350D;}

  /* ---------- MAIN ---------- */
  main{flex:1;padding:16px 16px 100px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .section-label{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--text-faint);
    margin:20px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{
    content:'';flex:1;height:1px;background:var(--border);
  }
  .section-label:first-child{margin-top:0;}

  /* ---------- EDIT MODE ---------- */
  .log-header-row{
    display:flex;align-items:center;gap:10px;margin:0 0 14px;
  }
  .log-header-row .section-label{flex:1;margin:0;}
  .progress-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:14px;flex-wrap:wrap;
  }
  .progress-chip{
    font-family:var(--font-mono);font-size:11px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-dim);padding:5px 10px;border-radius:999px;
  }
  .load-lastweek-btn{
    font-family:var(--font-mono);font-size:11px;font-weight:600;
    background:var(--pine-soft);border:1px solid var(--pine);
    color:var(--gold-strong);padding:6px 11px;border-radius:999px;
  }
  .load-lastweek-btn:active{background:var(--pine);color:var(--gold-ink);}
  .edit-toggle-btn{
    flex-shrink:0;font-family:var(--font-mono);font-size:11px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    padding:7px 11px;border-radius:8px;white-space:nowrap;
  }
  .edit-toggle-btn:active{background:var(--pine-soft);color:var(--gold-strong);border-color:var(--pine);}
  .edit-cancel-btn{
    flex-shrink:0;font-family:var(--font-mono);font-size:11px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-faint);
    padding:7px 11px;border-radius:8px;white-space:nowrap;
  }
  .edit-cancel-btn:active{background:var(--rust-soft);color:var(--rust);border-color:var(--rust);}
  .edit-ex-row{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;
  }
  .edit-ex-row-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .edit-ex-row-top .edit-name{flex:1;font-weight:600;}
  .edit-ex-row-bottom{display:grid;grid-template-columns:1fr 56px 108px;gap:8px;}
  .edit-ex-row input, .edit-ex-row select{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:13px;padding:8px 9px;font-family:var(--font-body);
    width:100%;
  }
  .edit-ex-row input:focus, .edit-ex-row select:focus{outline:none;border-color:var(--gold);}
  .del-ex-btn{
    flex-shrink:0;width:34px;height:34px;border-radius:8px;
    background:var(--rust-soft);border:1px solid var(--rust);color:var(--rust);
    font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .del-ex-btn:active{transform:scale(0.92);}
  .excel-db-box{
    background:var(--surface-2);border:1px dashed var(--border);
    border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;
  }
  .excel-db-title{
    font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
    font-weight:700;margin-bottom:3px;
  }
  .excel-db-desc{
    font-size:11px;color:var(--text-faint);line-height:1.5;margin-bottom:10px;
  }
  .autofill-box{
    background:var(--pine-soft);border:1px solid var(--pine);
    border-radius:var(--radius);padding:14px;margin-bottom:16px;
  }
  .autofill-box .excel-db-title{color:#C7CBA0;}
  .autofill-box .excel-db-desc{color:#C7CBA0;opacity:0.85;}
  .autofill-box .field{background:var(--surface);}
  .checkbox-row{
    display:flex;gap:14px;padding-top:2px;
  }
  .checkbox-row label{
    display:flex;align-items:center;gap:6px;
    font-size:13px;color:var(--text);font-weight:500;
  }
  .checkbox-row input[type="checkbox"]{
    width:16px;height:16px;accent-color:var(--gold);
  }
  .icon-check{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:7px 10px 7px 8px;
  }
  .icon-check:has(input:checked){
    background:var(--pine-soft);border-color:var(--pine);
  }
  .opt-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:17px;height:17px;color:var(--gold-strong);flex-shrink:0;
  }
  .opt-icon svg{width:100%;height:100%;}
  .tree-parent .opt-icon{color:var(--gold-strong);}
  input[type="range"]{
    accent-color:var(--gold);height:4px;margin-top:6px;
  }
  .tree-wrap{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:4px;
  }
  .tree-cat{margin-bottom:8px;}
  .tree-cat:last-child{margin-bottom:0;}
  .tree-parent{
    display:flex;align-items:center;gap:8px;
    font-family:var(--font-display);font-size:14px;font-weight:600;
    color:var(--text);padding:4px 0;
  }
  .tree-parent input[type="checkbox"]{
    width:17px;height:17px;accent-color:var(--gold);flex-shrink:0;
  }
  .tree-children{
    display:flex;flex-wrap:wrap;gap:6px 14px;
    padding:4px 0 4px 25px;
  }
  .tree-child{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--text-dim);
  }
  .tree-child input[type="checkbox"]{
    width:14px;height:14px;accent-color:var(--pine);flex-shrink:0;
  }

  /* ---------- EXERCISE CARD ---------- */
  .ex-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    margin-bottom:12px;
  }
  .ex-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:10px;margin-bottom:12px;
  }
  .ex-name{
    font-family:var(--font-display);
    font-size:17px;font-weight:600;
    letter-spacing:0.01em;
  }
  .ex-target{
    font-size:11.5px;color:var(--text-faint);
    font-family:var(--font-mono);
    margin-top:3px;
  }
  .yt-btn{
    flex-shrink:0;
    width:36px;height:36px;border-radius:50%;
    background:var(--surface-3);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    transition:all .15s;
  }
  .yt-btn:active{background:var(--rust-soft);border-color:var(--rust);transform:scale(0.94);}
  .yt-btn svg{width:15px;height:15px;fill:var(--text-dim);margin-left:2px;}
  .yt-btn:active svg{fill:var(--rust);}

  /* plate loader — signature element */
  .plate-row{
    display:flex;align-items:center;gap:9px;
    position:relative;
    margin-bottom:14px;
    padding:6px 2px;
  }
  .plate-row::before{
    content:'';position:absolute;left:8px;right:8px;top:50%;
    height:3px;background:var(--surface-3);
    border-radius:2px;transform:translateY(-50%);z-index:0;
  }
  .plate{
    position:relative;z-index:1;
    width:26px;height:26px;border-radius:50%;
    background:var(--surface-3);
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:10px;font-weight:700;
    color:var(--text-faint);
    transition:all .2s;
    flex-shrink:0;
  }
  .plate.filled{
    background:var(--gold);
    border-color:var(--gold-strong);
    color:var(--gold-ink);
    box-shadow:0 0 14px rgba(215,252,0,0.55);
  }

  .set-rows{display:flex;flex-direction:column;gap:8px;}
  .set-row{
    display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;
  }
  .set-row .set-num{

  .spin{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--border);border-top-color:var(--gold);
    animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  // leafKeys: 체크된 리프(가슴/등/.../기구유산소/맨몸유산소)의 sub 값 배열
  // equipKeys: 체크된 기구(machine/barbell/dumbbell/band/bodyweight) 배열, 비어있으면 기구 필터 없음
  // perLeaf: 부위(리프)당 뽑을 종목 개수
  function pickPresetExercises(leafKeys, equipKeys, difficulty, perLeaf){
    const picked = [];
    const skipped = [];
    leafKeys.forEach(leaf=>{
      let candidates = PRESET_LIBRARY.filter(p => p.sub === leaf);
      const isCardioLeaf = (leaf === 'cardio_equip' || leaf === 'cardio_body');
      if(!isCardioLeaf && equipKeys.length > 0){
        candidates = candidates.filter(p => equipKeys.includes(p.equip));
      }
      if(candidates.length === 0){
        skipped.push(leaf);
        return;
      }
      candidates = [...candidates].sort((a,b)=>Math.abs(a.diff-difficulty)-Math.abs(b.diff-difficulty));
      picked.push(...candidates.slice(0, Math.max(1, perLeaf||1)));
    });
    return {picked, skipped};
  }

  // 난이도(1~10)에 따라 세트/반복수 범위와 체감 강도 문구를 계산.
  // 실제 kg은 사람마다 1RM이 달라 알 수 없으므로, 숫자 대신 RPE(체감강도) 가이드로 표현한다.
  function buildScaledTarget(baseSets, diff, type){
    let guide;
    if(diff<=2) guide='가볍게 (RPE 4~5)';
    else if(diff<=4) guide='무난하게 (RPE 5~6)';
    else if(diff<=6) guide='적당히 힘들게 (RPE 6~7)';
    else if(diff<=8) guide='힘들게 (RPE 7~8)';
    else guide='최대 근접 (RPE 9~10)';

    if(type==='time'){
      let sec;
      if(diff<=2) sec='30~45초';
      else if(diff<=4) sec='45~60초';
      else if(diff<=6) sec='60~90초';
      else if(diff<=8) sec='90~120초';
      else sec='최대한 오래 버티기';
      return {sets: baseSets, target: `${baseSets}세트 × ${sec} · ${guide}`};
    }

    let low, high;
    if(diff<=2){ low=15; high=20; }
    else if(diff<=4){ low=12; high=15; }
    else if(diff<=6){ low=8; high=12; }
    else if(diff<=8){ low=6; high=8; }
    else { low=3; high=5; }

    const sets = (diff>=7) ? Math.max(baseSets, 4) : baseSets;
    return {sets, target: `${sets}세트 × ${low}~${high}회 · ${guide}`};
  }

  // 체크된 트리 상태를 보고 "가슴·어깨"처럼 요일 설명 문구를 자동 생성.
  // 카테고리의 하위가 전부 체크됐으면 카테고리명(상체 등)을, 일부만 체크됐으면 개별 명칭을 사용.
  function buildSubLabelFromTree(){
    const parts = [];
    BODY_TREE.forEach(cat=>{
      const children = [...document.querySelectorAll(`.tree-child-check[data-cat="${cat.key}"]`)];
      const checked = children.filter(c=>c.checked);
      if(checked.length === 0) return;
      if(checked.length === children.length){
        parts.push(cat.label);
      } else {
        checked.forEach(c=>{
          const chDef = cat.children.find(ch=>ch.key===c.value);
          if(chDef) parts.push(chDef.label);
        });
      }
    });
    return parts.join('·');
  }

  // EXERCISES[day] = [{fromWeek, exercises:[...]}, ...] (fromWeek 오름차순 정렬)
  let EXERCISES = null;

  function migrateExercisesFormat(rawExercises){
    // 예전 형식(요일당 평평한 배열)이면 1주차부터 적용되는 단일 버전으로 감싼다
    const result = {};
    Object.keys(rawExercises).forEach(day=>{
      const val = rawExercises[day];
      if(Array.isArray(val) && val.length > 0 && val[0] && 'fromWeek' in val[0]){
        result[day] = [...val].sort((a,b)=>a.fromWeek-b.fromWeek);
      } else {
        result[day] = [{fromWeek:1, exercises: val || []}];
      }
    });
    return result;
  }

  function wrapDefaultExercises(flatDefaults){
    const result = {};
    Object.keys(flatDefaults).forEach(day=>{
      result[day] = [{fromWeek:1, exercises: flatDefaults[day]}];
    });
    return result;
  }

  function getExercisesForWeek(day, week){
    const versions = EXERCISES[day];
    if(!versions || versions.length === 0) return [];
    let best = versions[0];
    for(const v of versions){
      if(v.fromWeek <= week) best = v; else break;
    }
    return best.exercises;
  }

  function getVersionsForDay(day){
    return EXERCISES[day] || [];
  }

  function upsertVersion(day, fromWeek, newExercises){
    const versions = EXERCISES[day];
    const existing = versions.find(v=>v.fromWeek===fromWeek);
    if(existing){
      existing.exercises = newExercises;
    } else {
      versions.push({fromWeek, exercises:newExercises});
    }
    versions.sort((a,b)=>a.fromWeek-b.fromWeek);
  }

  function allExerciseIdsEverUsed(day){
    // 모든 버전을 통틀어 등장한 적 있는 종목 전부(중복 id는 최신 정보 우선)
    const versions = getVersionsForDay(day);
    const map = new Map();
    versions.forEach(v=>{
      v.exercises.forEach(ex=>{ map.set(ex.id, ex); }); // 뒤(최신)에서 덮어써서 최신 정보가 남음
    });
    return [...map.values()];
  }

  /* ===================== STORAGE HELPERS ===================== */
  const hasBridge = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
  }

  async function getJSON(key){
    try{
      if(hasBridge){
        const r = await withTimeout(window.storage.get(key, false), 6000);
        if(!r || !r.value) return null;
        return JSON.parse(r.value);
      } else {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      }
    }catch(e){
      return null;
    }
  }
  async function setJSON(key, value){
    try{
      if(hasBridge){
        await withTimeout(window.storage.set(key, JSON.stringify(value), false), 6000);
      } else {
        localStorage.setItem(key, JSON.stringify(value));
      }
      return true;
    }catch(e){
      console.error('storage set failed', e);
      return false;
    }
  }
  function keyLog(day, week){ return `log:${day}:w${week}`; }
  function keyBody(week){ return `body:w${week}`; }
  function keyNote(week){ return `note:w${week}`; }
  async function deleteKey(key){
    try{
      if(hasBridge){
        await window.storage.delete(key, false);
      } else {
        localStorage.removeItem(key);
      }
      return true;
    }catch(e){
      return false;
    }
  }

  function debounce(fn, ms){
    let t;
    return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };

  async function loadLastWeekData(){
    if(state.week <= 1){

    const prevLog = await getJSON(keyLog(state.day, state.week - 1));

      showToast('지난주 기록이 없어요');
      return;
    }

    const inputs = [...document.querySelectorAll('#panel-log input[data-ex]')];
    let hintCount = 0;
    inputs.forEach(inp=>{
      if(inp.value !== '') return; // 이미 입력한 칸은 건드리지 않음
      const exId = inp.dataset.ex, set = +inp.dataset.set, field = inp.dataset.field;
      const sets = prevLog[exId];
      const prevVal = sets && sets[set] ? sets[set][field] : undefined;
      if(prevVal !== undefined && prevVal !== ''){
        inp.placeholder = `지난주 ${prevVal}`;
        inp.classList.add('hint-filled');
        hintCount++;
      }
    });

    if(hintCount === 0){
      showToast('불러올 지난주 기록이 없어요');
      return;
    }
    showToast(`지난주 기록 ${hintCount}칸 참고로 표시됨`);
  }

      childCb.addEventListener('change', ()=>{
        const cat = childCb.dataset.cat;
        const children = [...document.querySelectorAll(`.tree-child-check[data-cat="${cat}"]`)];
        const checkedCount = children.filter(c=>c.checked).length;
        const parentCb = document.querySelector(`.tree-parent-check[data-cat="${cat}"]`);
        if(parentCb){
          parentCb.checked = (checkedCount === children.length);
          parentCb.indeterminate = (checkedCount > 0 && checkedCount < children.length);
        }
      });
    });
  }

  function runAutofill(){
    const diff = parseInt(document.getElementById('autofillDiff').value, 10);
    const equipKeys = [...document.querySelectorAll('.equip-check:checked')].map(cb=>cb.value);
    const leafKeys = [...document.querySelectorAll('.tree-child-check:checked')].map(cb=>cb.value);

    if(leafKeys.length === 0){
      showToast('부위를 1개 이상 선택하세요');
      return;

    const {picked, skipped} = pickPresetExercises(leafKeys, equipKeys, diff, perLeaf);
    if(picked.length === 0){
      showToast('조건에 맞는 운동을 찾지 못했어요');
      return;
    }

    const newSub = buildSubLabelFromTree();

    let msg = `추천 운동 ${picked.length}개로 현재 목록을 교체할까요?`;
    if(newSub) msg += `\n요일 설명도 "${newSub}"(으)로 함께 바뀌어요.`;
    if(skipped.length > 0) msg += `\n(선택한 기구로는 일부 부위에 맞는 운동을 찾지 못해 건너뛰었어요)`;
    msg += `\n(저장 버튼을 누르기 전까지는 취소 가능해요)`;
    const proceed = confirm(msg);
    if(!proceed) return;

    const list = document.getElementById('editExList');
    list.innerHTML = picked.map((p, idx) => {
      const scaled = buildScaledTarget(p.sets, diff, p.type);
      return renderEditRow({
        id: `${state.day}-preset-${Date.now()}-${idx}`,

    bindDeleteButtons();

    if(newSub){

  async function saveConfig(){
    const subInput = document.getElementById('editSubInput').value.trim();

    const label = document.getElementById('editLabelSelect').value;
    let fromWeek = parseInt(document.getElementById('editFromWeek').value, 10);

    fromWeek = Math.max(1, Math.min(12, fromWeek));

    const rows = [...document.querySelectorAll('.edit-ex-row')];

    const newExercises = rows.map(row=>{
      const id = row.dataset.id;
      const name = row.querySelector('.edit-name').value.trim();
      const target = row.querySelector('.edit-target').value.trim() || '목표 미설정';
      let sets = parseInt(row.querySelector('.edit-sets').value, 10);
      if(isNaN(sets)) sets = 3;
      sets = Math.max(1, Math.min(8, sets));
      const type = row.querySelector('.edit-type').value;
      return {id, name, target, sets, type};
    }).filter(ex => ex.name !== '');

    if(newExercises.length === 0){
      showToast('운동을 1개 이상 남겨주세요');
      return;

    upsertVersion(state.day, fromWeek, newExercises);
    DAY_SUBS[state.day] = sub;
    DAY_LABELS[state.day] = label;

    const ok = await setJSON('workoutConfig', {exercises: EXERCISES, subs: DAY_SUBS, labels: DAY_LABELS});

    state.editMode = false;
    renderDayPills();
    renderLogPanel();

  /* ===================== EXCEL DB EXPORT / IMPORT ===================== */
  function exportExerciseDBExcel(){
    if(typeof XLSX === 'undefined'){
      showToast('엑셀 기능을 불러오지 못했어요');
      return;
    }
    const rows = [['day_code','day_label','from_week','id','name','target','sets','type']];
    DAYS.forEach(d=>{
      const versions = getVersionsForDay(d.code);
      versions.forEach(v=>{
        v.exercises.forEach(ex=>{
          rows.push([d.code, DAY_LABELS[d.code], v.fromWeek, ex.id, ex.name, ex.target, ex.sets, ex.type]);
        });
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:9},{wch:8},{wch:9},{wch:14},{wch:20},{wch:22},{wch:6},{wch:8}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Exercises');
    XLSX.writeFile(wb, 'workout-tracker-exercises.xlsx');
    showToast('엑셀 파일 다운로드됨');
  }

  async function importExerciseDBExcel(file){
    if(typeof XLSX === 'undefined'){
      showToast('엑셀 기능을 불러오지 못했어요');
      return;
    }
    let rows;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1});
    }catch(e){
      showToast('엑셀 파일을 읽지 못했어요');
      return;
    }
    if(!rows || rows.length < 2){
      showToast('내용이 비어있는 파일이에요');
      return;
    }

    const header = rows[0].map(h => String(h || '').trim().toLowerCase());
    const need = ['day_code','from_week','id','name','target','sets','type'];
    const idx = {};
    need.forEach(k => idx[k] = header.indexOf(k));
    if(Object.values(idx).some(v => v === -1)){
      showToast('엑셀 형식이 올바르지 않아요 (열 이름 확인 필요)');
      return;
    }

    const byDayWeek = {};
    let validRowCount = 0;
    for(let i=1; i<rows.length; i++){
      const r = rows[i];
      if(!r || r.length === 0) continue;
      const dayCode = String(r[idx.day_code] || '').trim();
      if(!DAYS.find(d => d.code === dayCode)) continue;
      const name = String(r[idx.name] || '').trim();
      if(!name) continue;

      let fromWeek = parseInt(r[idx.from_week], 10);
      if(isNaN(fromWeek)) fromWeek = 1;
      fromWeek = Math.max(1, Math.min(12, fromWeek));

      const id = String(r[idx.id] || '').trim() || `${dayCode}-imp-${i}`;
      const target = String(r[idx.target] || '').trim() || '목표 미설정';
      let sets = parseInt(r[idx.sets], 10);
      if(isNaN(sets)) sets = 3;
      sets = Math.max(1, Math.min(8, sets));
      let type = String(r[idx.type] || 'weight').trim();
      if(!['weight','reps','time'].includes(type)) type = 'weight';

      if(!byDayWeek[dayCode]) byDayWeek[dayCode] = {};
      if(!byDayWeek[dayCode][fromWeek]) byDayWeek[dayCode][fromWeek] = [];
      byDayWeek[dayCode][fromWeek].push({id, name, target, sets, type});
      validRowCount++;
    }

    if(validRowCount === 0){
      showToast('가져올 수 있는 유효한 행이 없어요');
      return;
    }

    const proceed = confirm(
      `엑셀에서 ${validRowCount}개의 종목을 찾았어요.\n\n` +
      '이 내용으로 해당 요일들의 종목 설정을 덮어씁니다 (엑셀에 없는 요일은 그대로 유지). 계속할까요?'
    );
    if(!proceed) return;

    Object.keys(byDayWeek).forEach(dayCode=>{
      const weeksObj = byDayWeek[dayCode];
      const versions = Object.keys(weeksObj)
        .map(w => ({fromWeek: parseInt(w, 10), exercises: weeksObj[w]}))
        .sort((a,b) => a.fromWeek - b.fromWeek);
      if(versions.length && versions[0].fromWeek !== 1){
        versions[0].fromWeek = 1;
      }
      EXERCISES[dayCode] = versions;
    });

    const ok = await setJSON('workoutConfig', {exercises: EXERCISES, subs: DAY_SUBS, labels: DAY_LABELS});
    showToast(ok ? '엑셀에서 불러왔어요' : '저장 실패');

    state.editMode = false;
    renderDayPills();
    renderLogPanel();
  }

  function bindLogInputs(){

      const log = {};
      inputs.forEach(inp=>{
        const exId = inp.dataset.ex, set = +inp.dataset.set, field = inp.dataset.field;

    document.querySelectorAll('#panel-log input[data-ex]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        inp.classList.remove('hint-filled');

  function renderPlatesOnly(log){
    getExercisesForWeek(state.day, state.week).forEach(ex=>{
      const card = [...document.querySelectorAll('.ex-card')].find(c=>c.querySelector('.ex-name').textContent===ex.name);

  function countDoneExercises(log){
    if(!log) return 0;
    let count = 0;
    Object.values(log).forEach(sets=>{
      if(Array.isArray(sets) && sets.some(s => s && (s.w || s.r || s.v))) count++;
    });
    return count;
  }

  function ratioClass(ratio){
    if(ratio >= 1) return 'p4';
    if(ratio > 0.66) return 'p3';
    if(ratio > 0.33) return 'p2';
    if(ratio > 0) return 'p1';
    return '';
  }

  async function drawConsistency(){
    const area = document.getElementById('consistencyArea');
    const weeks = Array.from({length:12},(_,i)=>i+1);

    let allLogs;
    try{
      const tasks = [];
      DAYS.forEach(d=>{
        weeks.forEach(w=>{
          const total = getExercisesForWeek(d.code, w).length || 1;
          tasks.push(getJSON(keyLog(d.code, w)).then(log=>({
            code:d.code, w, total,
            done: countDoneExercises(log)
          })));
        });
      });
      allLogs = await withTimeout(Promise.all(tasks), 8000);
    }catch(e){
      area.innerHTML = `
        <div class="empty-note">데이터를 불러오는 데 문제가 있었어요.</div>
        <button class="btn" id="retryConsistencyBtn" style="margin-top:6px;">다시 시도</button>`;
      const btn = document.getElementById('retryConsistencyBtn');
      if(btn) btn.addEventListener('click', drawConsistency);
      return;
    }

    const map = {};
    let ratioSum = 0;
    allLogs.forEach(item=>{
      const ratio = item.total ? item.done/item.total : 0;
      map[`${item.code}:${item.w}`] = {done:item.done, total:item.total, ratio};
      ratioSum += ratio;
    });

    const totalSlots = DAYS.length * 12;
    const avgPct = totalSlots ? Math.round((ratioSum/totalSlots)*100) : 0;

    const headerCells = `<div class="consistency-head"></div>` +
      DAYS.map(d=>`<div class="consistency-head">${DAY_LABELS[d.code]}</div>`).join('');

    const bodyCells = weeks.map(w=>{
      const weekLabel = `<div class="consistency-week-label">${w}</div>`;
      const dayCells = DAYS.map(d=>{
        const info = map[`${d.code}:${w}`] || {done:0, total:1, ratio:0};
        const isCurrent = (w === state.week);
        const cls = ratioClass(info.ratio);
        return `<div class="consistency-cell ${cls} ${isCurrent?'current':''}" title="${DAY_LABELS[d.code]}요일 ${w}주 · ${info.done}/${info.total}종목"></div>`;
      }).join('');
      return weekLabel + dayCells;
    }).join('');

    area.innerHTML = `
      <div class="consistency-summary">
        <span class="consistency-pct">${avgPct}%</span>
        <span class="consistency-pct-label">지난 12주 평균 수행률</span>
      </div>
      <div class="consistency-grid">
        ${headerCells}
        ${bodyCells}
      </div>
      <div class="consistency-legend">
        <span>적음</span>
        <span class="legend-swatch"></span>
        <span class="legend-swatch p1"></span>
        <span class="legend-swatch p2"></span>
        <span class="legend-swatch p3"></span>
        <span class="legend-swatch p4"></span>
        <span>전체 완료</span>
      </div>
    `;
  }

  async function drawChart(exId){
    const flat = allExercisesFlat();
    const ex = flat.find(e=>e.id===exId);
    const area = document.getElementById('chartArea');

    if(!ex){
      area.innerHTML = `<div class="empty-note">운동 정보를 찾을 수 없어요. 다른 운동을 선택해보세요.</div>`;
      return;
    }

    area.innerHTML = `<div class="loading-wrap"><div class="spin"></div> 불러오는 중</div>`;

    const weeks = Array.from({length:12},(_,i)=>i+1);
    let logs;
    try{
      logs = await withTimeout(Promise.all(weeks.map(w=>getJSON(keyLog(ex.day, w)))), 8000);
    }catch(e){
      area.innerHTML = `
        <div class="empty-note">데이터를 불러오는 데 문제가 있었어요.</div>
        <button class="btn" id="retryChartBtn" style="margin-top:6px;">다시 시도</button>`;
      const retryBtn = document.getElementById('retryChartBtn');
      if(retryBtn) retryBtn.addEventListener('click', ()=>drawChart(exId));
      return;
    }

    const points = weeks.map((w,i)=>{
      const log = logs[i];
      if(!log || !log[exId]) return null;
      const sets = log[exId];
      let best = null;
      sets.forEach(s=>{
        if(!s) return;
        let val, extra = null;
        if(ex.type==='weight'){
          val = (s.w!==undefined && s.r!==undefined) ? parseFloat(s.w) : null;
          extra = s.r;
        } else {
          val = s.v!==undefined ? parseFloat(s.v) : null;
        }
        if(val!==null && !isNaN(val) && (best===null || val>best.v)) best = {v:val, extra};
      });
      return best;
    });

    const unit = ex.type==='weight' ? 'kg' : (ex.type==='time' ? '초' : '회');
    const valid = points
      .map((p,i)=>({w:weeks[i], v:p ? p.v : null, extra:p ? p.extra : null}))
      .filter(p=>p.v!==null);

    let chartSVG = '';
    let maxPoint = null;
    if(valid.length === 0){
      chartSVG = `<div class="empty-note">아직 기록된 데이터가 없어요.<br>기록 탭에서 ${ex.name}을(를) 입력해보세요.</div>`;
    } else {
      const W = 320, H = 140, pad = 24;
      const maxV = Math.max(...valid.map(p=>p.v)) * 1.25;
      const minV = Math.min(0, Math.min(...valid.map(p=>p.v)) * 0.9);
      const xFor = w => pad + ((w-1)/11) * (W - pad*2);
      const yFor = v => H - pad - ((v-minV)/(maxV-minV || 1)) * (H - pad*2);

      const linePts = valid.map(p=>`${xFor(p.w)},${yFor(p.v)}`).join(' ');
      maxPoint = valid.reduce((a,b)=> b.v>a.v ? b : a, valid[0]);

      const dots = valid.map(p=>{
        const isMax = p.w===maxPoint.w;
        const repLabel = (ex.type==='weight' && p.extra) ? `<text x="${xFor(p.w)}" y="${yFor(p.v)-9}" font-size="8" fill="var(--text-faint)" text-anchor="middle" font-family="var(--font-mono)">×${p.extra}</text>` : '';
        return `<circle cx="${xFor(p.w)}" cy="${yFor(p.v)}" r="${isMax?5:3.5}" fill="${isMax?'var(--gold-strong)':'#EEEAE1'}" stroke="${isMax?'#12171A':'none'}" stroke-width="1.5"/>${repLabel}`;
      }).join('');

      const gridLines = [0,0.5,1].map(f=>{
        const y = pad + f*(H-pad*2);
        return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#2C3639" stroke-width="1"/>`;
      }).join('');

      chartSVG = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
        ${gridLines}
        <polyline points="${linePts}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
      <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);padding:0 4px;">
        <span>1주</span><span>6주</span><span>12주</span>
      </div>`;
    }

    area.innerHTML = `
      <div class="chart-card">
        <div class="chart-title">${ex.name} <span style="color:var(--text-faint);font-weight:400;">· 세트 최고 기록 (${unit})</span>
        ${valid.length? `<span class="pr-badge">PR ${maxPoint.v}${unit}${(ex.type==='weight' && maxPoint.extra) ? ` ×${maxPoint.extra}` : ''}</span>`:''}
        </div>
        ${chartSVG}
      </div>
      <div class="section-label">주차별 상세</div>
      ${valid.length ? `<table class="history-table"><thead><tr><th>주차</th><th>최고 기록</th></tr></thead><tbody>
        ${valid.map(p=>`<tr><td>${p.w}주</td><td>${p.v}${unit}${(ex.type==='weight' && p.extra) ? ` · ${p.extra}회` : ''}</td></tr>`).join('')}
      </tbody></table>` : ''}
    `;
  }

  async function drawWeightChart(){
    const area = document.getElementById('weightChartArea');
    if(!area) return;

    const weeks = Array.from({length:12},(_,i)=>i+1);
    let bodies, baseline;
    try{
      [bodies, baseline] = await withTimeout(
        Promise.all([Promise.all(weeks.map(w=>getJSON(keyBody(w)))), getJSON('baselineRecord')]),
        8000
      );
    }catch(e){
      area.innerHTML = `<div class="empty-note">데이터를 불러오는 데 문제가 있었어요.</div>`;
      return;
    }

    const points = [];
    if(baseline && baseline.weight !== '' && baseline.weight !== undefined){
      const v = parseFloat(baseline.weight);
      if(!isNaN(v)) points.push({w:0, v});
    }
    weeks.forEach((w,i)=>{
      const b = bodies[i];
      if(b && b.weight !== '' && b.weight !== undefined){
        const v = parseFloat(b.weight);
        if(!isNaN(v)) points.push({w, v});
      }
    });

    if(points.length < 2){
      area.innerHTML = `<div class="empty-note">체중을 2회 이상 기록하면<br>변화 그래프가 나타나요.</div>`;
      return;
    }

    const W = 320, H = 130, pad = 24;
    const vals = points.map(p=>p.v);
    const maxV = Math.max(...vals) * 1.03;
    const minV = Math.min(...vals) * 0.97;
    const xFor = w => pad + (w/12) * (W - pad*2);
    const yFor = v => H - pad - ((v-minV)/(maxV-minV || 1)) * (H - pad*2);

    const linePts = points.map(p=>`${xFor(p.w)},${yFor(p.v)}`).join(' ');
    const dots = points.map((p,i)=>{
      const isLast = i === points.length - 1;
      return `<circle cx="${xFor(p.w)}" cy="${yFor(p.v)}" r="${isLast?5:3}" fill="${isLast?'var(--gold-strong)':'#FFFFFF'}" stroke="${isLast?'#10110C':'none'}" stroke-width="1.5"/>`;
    }).join('');

    const gridLines = [0,0.5,1].map(f=>{
      const y = pad + f*(H-pad*2);
      return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }).join('');

    const first = points[0].v;
    const last = points[points.length-1].v;
    const diff = Math.round((last-first)*10)/10;
    const diffLabel = diff > 0 ? `+${diff}kg` : `${diff}kg`;
    const diffColor = diff <= 0 ? 'var(--gold-strong)' : 'var(--rust)';

    area.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
        ${gridLines}
        <polyline points="${linePts}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
      <div style="text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:6px;">
        ${first}kg → ${last}kg <span style="color:${diffColor};font-weight:800;">(${diffLabel})</span>
      </div>
    `;
  }

  /* ===================== SEASON ARCHIVE ===================== */
  async function archiveCurrentSeason(){
    const keys = allDataKeys().filter(k =>
      k !== 'settings' && k !== 'workoutConfig' && k !== 'baselineRecord'
    );
    const data = {};
    for(const k of keys){
      const raw = hasBridge
        ? (await (async()=>{ try{ const r = await withTimeout(window.storage.get(k,false),6000); return r ? r.value : null; }catch(e){ return null; } })())
        : localStorage.getItem(k);
      if(raw !== null && raw !== undefined) data[k] = raw;
    }

    const baseline = await getJSON('baselineRecord');
    let endWeight = null;
    for(let w = 12; w >= 1; w--){
      const b = await getJSON(keyBody(w));
      if(b && b.weight){ endWeight = b.weight; break; }
    }

    const id = 'archive:' + Date.now();
    const summary = {
      id,
      archivedAt: new Date().toISOString(),
      startWeight: baseline?.weight || null,
      endWeight
    };

    await setJSON(id, {summary, data});

    const idxRaw = await getJSON('archiveIndex');
    const idx = Array.isArray(idxRaw) ? idxRaw : [];
    idx.push(summary);
    await setJSON('archiveIndex', idx);
  }

  async function downloadArchive(id){
    const record = await getJSON(id);
    if(!record){
      showToast('찾을 수 없어요');

    const blob = new Blob([JSON.stringify(record, null, 2)], {type:'application/json'});

  /* ===================== JSON BACKUP / RESTORE ===================== */
  function allDataKeys(){
    const keys = ['settings', 'workoutConfig', 'baselineRecord'];
    DAYS.forEach(d=>{
      for(let w=1; w<=12; w++) keys.push(keyLog(d.code, w));
    });
    for(let w=1; w<=12; w++){
      keys.push(keyBody(w));
      keys.push(keyNote(w));
    }
    return keys;
  }

  async function backupAllData(){
    showToast('백업 파일 준비 중...');
    const keys = allDataKeys();
    const data = {};
    for(const k of keys){
      const raw = hasBridge
        ? (await (async()=>{ try{ const r = await withTimeout(window.storage.get(k,false),6000); return r ? r.value : null; }catch(e){ return null; } })())
        : localStorage.getItem(k);
      if(raw !== null && raw !== undefined) data[k] = raw;
    }
    const payload = {app:'workout-tracker', version:'v1.0', exportedAt:new Date().toISOString(), data};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `workout-tracker-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('백업 완료');
  }

  async function restoreFromFile(file){
    let payload;
    try{
      const text = await file.text();
      payload = JSON.parse(text);
    }catch(e){
      showToast('올바른 백업 파일이 아니에요');
      return;
    }
    if(!payload || typeof payload.data !== 'object'){
      showToast('올바른 백업 파일이 아니에요');
      return;
    }
    const proceed = confirm(
      '이 백업 파일로 복원하면 현재 이 브라우저에 저장된 모든 기록이 백업 시점 내용으로 덮어써집니다.\n\n계속할까요?'
    );
    if(!proceed) return;

    showToast('복원 중...');
    for(const [k, v] of Object.entries(payload.data)){
      if(hasBridge){
        try{ await withTimeout(window.storage.set(k, v, false), 6000); }catch(e){ /* ignore single-key failure */ }
      } else {
        localStorage.setItem(k, v);
      }
    }
    showToast('복원 완료! 새로고침합니다');
    setTimeout(()=>location.reload(), 900);
  }

  /* ===================== CSV EXPORT ===================== */
  async function exportCSV(){
    showToast('내보내는 중...');
    const rows = [['구분','요일','주차','항목','세트','값1','값2','단위']];

    for(const d of DAYS){
      const everUsed = allExerciseIdsEverUsed(d.code);
      for(let w=1; w<=12; w++){
        const log = await getJSON(keyLog(d.code, w));
        if(!log) continue;
        everUsed.forEach(ex=>{
          const sets = log[ex.id];
          if(!sets) return;
          sets.forEach((s,i)=>{
            if(!s) return;
            if(ex.type==='weight' && (s.w||s.r)){
              rows.push(['운동기록', DAY_LABELS[d.code], w, ex.name, i+1, s.w||'', s.r||'', 'kg/회']);
            } else if(ex.type!=='weight' && s.v){
              rows.push(['운동기록', DAY_LABELS[d.code], w, ex.name, i+1, s.v, '', ex.type==='time'?'초':'회']);
            }
          });
        });
      }
    }
    for(let w=1; w<=12; w++){
      const b = await getJSON(keyBody(w));
      if(b && (b.weight||b.waist)){
        rows.push(['신체기록','', w, '체중/허리/배꼽', '', b.weight||'', b.waist||'', 'kg/cm']);
        if(b.bodyFat || b.muscle) rows.push(['신체기록','', w, '체지방률/골격근량', '', b.bodyFat||'', b.muscle||'', '%/kg']);
      }
      const n = await getJSON(keyNote(w));
      if(n && n.text) rows.push(['주간메모','', w, '다짐/메모', '', n.text, '', '']);
    }

    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'workout-tracker-log.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('다운로드 완료');
  }

  async function startNewCycle(){
    showToast('백업 파일 준비 중...');
    await exportCSV();

    const proceed = confirm(
      'CSV 백업이 완료됐어요.\n\n' +
      '지금까지의 모든 주차 기록(운동 기록·신체 기록)을 지우고 1주차부터 새로 시작할까요?\n' +
      '지금 시즌 기록은 앱 안 "지난 시즌 기록"에 자동 보관됩니다.\n' +
      '가장 최근 신체 기록이 있다면 새 시작값으로 자동 반영됩니다.\n' +
      '운동 종목 설정은 그대로 유지됩니다.'
    );
    if(!proceed) return;

    showToast('지난 시즌 기록 보관 중...');
    await archiveCurrentSeason();

    // 가장 최근에 기록된 주차의 신체 데이터를 새 시즌의 시작값(0주)으로 승계
    let newBaseline = null;
    for(let w = 12; w >= 1; w--){
      const b = await getJSON(keyBody(w));
      if(b && (b.weight || b.waist)){
        newBaseline = {
          date: b.date || '',
          weight: b.weight || '',
          bodyFat: b.bodyFat || '',
          muscle: b.muscle || '',
          waist: b.waist || '',
          navel: b.navel || '',
          memo: `이전 시즌 ${w}주차 기록에서 이어짐`
        };
        break;
      }
    }
    if(newBaseline) await setJSON('baselineRecord', newBaseline);

    // 주차별 데이터 전체 삭제 (운동 종목 설정·요일 설정은 유지)
    const deletions = [];
    DAYS.forEach(d=>{
      for(let w=1; w<=12; w++) deletions.push(deleteKey(keyLog(d.code, w)));
    });
    for(let w=1; w<=12; w++){
      deletions.push(deleteKey(keyBody(w)));
      deletions.push(deleteKey(keyNote(w)));
    }
    await Promise.all(deletions);

    state.week = 1;
    await setJSON('settings', {week: 1});
    showToast('새 시즌 시작!');
    renderWeekLabel();
    renderBodyPanel();
  }

    'https://images.unsplash.com/photo-1651315283994-03ec73dc21f1?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDYzfHxneW0lMjB0b29sfGVufDB8fDB8fHww'
  ];
  function applyRandomHeaderImage(){
    const pick = HEADER_IMAGES[Math.floor(Math.random() * HEADER_IMAGES.length)];
    document.documentElement.style.setProperty('--header-img', `url('${pick}')`);
  }

  async function init(){
    applyRandomHeaderImage();
    const [settings, config] = await Promise.all([
      getJSON('settings'),
      getJSON('workoutConfig')
    ]);
    if(settings && settings.week) state.week = settings.week;

    if(config && config.exercises && config.subs){
      EXERCISES = migrateExercisesFormat(config.exercises);
      DAY_SUBS = config.subs;
      DAY_LABELS = config.labels || {...DEFAULT_LABELS};
    } else {
      EXERCISES = wrapDefaultExercises(JSON.parse(JSON.stringify(DEFAULT_EXERCISES)));
      DAY_SUBS = {...DEFAULT_SUBS};
      DAY_LABELS = {...DEFAULT_LABELS};
      await setJSON('workoutConfig', {exercises: EXERCISES, subs: DAY_SUBS, labels: DAY_LABELS});
    }

    state.day = suggestDayFromLabels();

    renderDayPills();
    renderWeekLabel();

    document.getElementById('weekPrev').addEventListener('click', async ()=>{
      state.week = Math.max(1, state.week-1);
      renderWeekLabel();
      await setJSON('settings', {week: state.week});
      if(state.tab==='log') renderLogPanel();
      if(state.tab==='body') renderBodyPanel();
    });
    document.getElementById('weekNext').addEventListener('click', async ()=>{
      state.week = Math.min(12, state.week+1);
      renderWeekLabel();
      await setJSON('settings', {week: state.week});
      if(state.tab==='log') renderLogPanel();
      if(state.tab==='body') renderBodyPanel();
    });
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
    });
    document.getElementById('musicBtn').addEventListener('click', openWorkoutMusic);

    renderLogPanel();
  }

  init();
})();
</script>
</body>
</html>
